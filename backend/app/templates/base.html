<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>BRAINBOARD // COMMAND DECK</title>
  <!-- All frontend dependencies are vendored under app/static/vendor -- no
       runtime CDN calls, so the deck keeps working on a VPS with locked-down
       egress. Rebuild app/static/css/tailwind.css via `npm run build-css`
       after changing utility classes in app/templates/**. -->
  <link rel="stylesheet" href="/static/css/tailwind.css" />
  <link rel="stylesheet" href="/static/css/tactical.css" />
  <script src="/static/vendor/htmx/htmx.min.js"></script>
  <script src="/static/vendor/htmx/json-enc.js"></script>
  <script defer src="/static/vendor/alpine/alpine.min.js"></script>
  {% block extra_head %}{% endblock %}
</head>
<body class="text-sm" hx-ext="json-enc">
  <div class="warning-stripe"></div>
  <header class="tactical-panel border-b border-[var(--panel-border)]">
    <div class="max-w-[1600px] mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <div class="stencil-header text-[var(--amber)] text-base">BRAINBOARD</div>
        <div class="text-[10px] tracking-[0.2em] text-[var(--text-dim)] uppercase">Institutional Credit Arbitrage // Macro-Surveillance Grid</div>
      </div>
      <nav class="flex flex-wrap justify-end">
        <a href="/intake" class="tactical-nav-link {{ 'active' if active_nav == 'intake' else '' }}">Intake</a>
        <a href="/master-log" class="tactical-nav-link {{ 'active' if active_nav == 'master-log' else '' }}">Pipeline</a>
        <a href="/silo-grid" class="tactical-nav-link {{ 'active' if active_nav == 'silo-grid' else '' }}">Targets</a>
        <a href="/enrichment" class="tactical-nav-link {{ 'active' if active_nav == 'enrichment' else '' }}">Intelligence</a>
        <a href="/calls" class="tactical-nav-link {{ 'active' if active_nav == 'calls' else '' }}">Calls</a>
        <a href="/dialer" class="tactical-nav-link {{ 'active' if active_nav == 'dialer' else '' }}">Dialer</a>
        <a href="/brain" class="tactical-nav-link {{ 'active' if active_nav == 'brain' else '' }}">Brain</a>
        <a href="/globe" class="tactical-nav-link {{ 'active' if active_nav == 'globe' else '' }}">Globe</a>
        <a href="/analytics" class="tactical-nav-link {{ 'active' if active_nav == 'analytics' else '' }}">Analytics</a>
        <a href="/surveillance" class="tactical-nav-link {{ 'active' if active_nav == 'surveillance' else '' }}">Surveillance</a>
      </nav>
      <div class="flex items-center gap-3">
        <select id="active-line-select" title="Active line for click-to-call" class="tactical-select text-[10px] py-1">
          <option value="">Loading lines...</option>
        </select>
        <div class="text-right text-[10px] text-[var(--text-dim)] uppercase tracking-widest" x-data="{ now: '' }" x-init="setInterval(() => now = new Date().toISOString().replace('T',' ').slice(0,19) + 'Z', 1000)">
          <span x-text="now"></span>
        </div>
      </div>
    </div>
  </header>
  <div class="warning-stripe"></div>

  <main class="max-w-[1600px] mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <!-- Global click-to-call + live screen-pop widget -- present on every page.
       Click-to-call: any element anywhere can call window.brainboardCallNow('lead'|'silo_candidate', entityUid);
       it fires an ad hoc call under whichever campaign is picked in the header selector above.
       Screen pop: polls for that call going live and floats this panel with notes/activity/enrichment
       for the entity being called, so it's on screen while the call is happening. -->
  <div id="screen-pop-panel" class="hidden fixed bottom-4 right-4 w-[360px] max-h-[70vh] overflow-y-auto tactical-panel p-4 z-50" style="box-shadow: 0 0 24px rgba(0,0,0,0.6);"></div>

  <script>
  (function() {
    const ACTIVE_LINE_KEY = "brainboard_active_campaign_id";
    const poppedAttempts = new Set();

    async function fetchJSON(url, opts) {
      const res = await fetch(url, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.detail ? JSON.stringify(data.detail) : `${url} -> ${res.status}`);
      return data;
    }

    async function initActiveLineSelect() {
      const select = document.getElementById("active-line-select");
      try {
        const campaigns = await fetchJSON("/api/dialer/campaigns");
        const saved = localStorage.getItem(ACTIVE_LINE_KEY);
        select.innerHTML = campaigns.length
          ? campaigns.map(c => `<option value="${c.id}">${c.name}</option>`).join("")
          : '<option value="">No campaigns yet</option>';
        if (saved && campaigns.some(c => c.id === saved)) select.value = saved;
        else if (campaigns.length) localStorage.setItem(ACTIVE_LINE_KEY, select.value);
        select.addEventListener("change", () => localStorage.setItem(ACTIVE_LINE_KEY, select.value));
      } catch (err) {
        select.innerHTML = '<option value="">Dialer unavailable</option>';
      }
    }

    window.brainboardCallNow = async function(kind, entityUid) {
      const campaignId = localStorage.getItem(ACTIVE_LINE_KEY);
      if (!campaignId) { alert("Pick an active line in the header first."); return; }
      const payload = kind === "lead" ? { lead_uid: entityUid } : { silo_candidate_uid: entityUid };
      try {
        await fetchJSON(`/api/dialer/campaigns/${campaignId}/call-now`, {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
        });
      } catch (err) {
        alert("Call failed: " + err.message);
      }
    };

    function renderScreenPop(attempt, data) {
      const panel = document.getElementById("screen-pop-panel");
      const needsBroker = data.kind === "silo_candidate";
      const activityLines = (data.activity || []).slice(0, 6).map(a =>
        `<div class="text-[var(--text-dim)]">${a.occurred_at.slice(0,16).replace('T',' ')} — ${a.event_type}${a.field_name ? ' ('+a.field_name+')' : ''}${a.new_value ? ': '+a.new_value : ''}</div>`
      ).join("") || '<div class="text-[var(--text-dim)]">No activity logged yet.</div>';
      const enrichmentLines = (data.enrichment || []).slice(0, 4).map(e =>
        `<div class="text-[var(--text-dim)]">${e.source}: <span class="text-[var(--text-primary)]">${JSON.stringify(e.payload).slice(0, 140)}</span></div>`
      ).join("") || '<div class="text-[var(--text-dim)]">No enrichment on file.</div>';
      const brokerOptions = {{ CO_BROKERS|tojson }}.map(cb => `<option value="${cb}">${cb}</option>`).join("");

      panel.innerHTML = `
        <div class="flex items-center justify-between mb-2">
          <div class="stencil-header text-[var(--amber)] text-xs">LIVE CALL // ${data.company_name}</div>
          <button onclick="document.getElementById('screen-pop-panel').classList.add('hidden')" class="text-[var(--text-dim)] hover:text-[var(--crimson)]">✕</button>
        </div>
        <div class="text-[10px] mb-2">
          <div>${data.phone || '—'}${data.email ? ' · ' + data.email : ''}</div>
          <div class="text-[var(--text-dim)]">${data.kind === 'lead' ? data.status : data.silo + ' · ' + data.status}</div>
        </div>
        <div class="text-[10px] mb-2"><b class="text-[var(--text-dim)] uppercase tracking-widest">Notes</b><div class="mt-1">${data.notes || '—'}</div></div>
        <div class="text-[10px] mb-2"><b class="text-[var(--text-dim)] uppercase tracking-widest">Recent Activity</b><div class="mt-1 flex flex-col gap-0.5">${activityLines}</div></div>
        <div class="text-[10px] mb-3"><b class="text-[var(--text-dim)] uppercase tracking-widest">Enrichment</b><div class="mt-1 flex flex-col gap-0.5">${enrichmentLines}</div></div>
        <div class="flex items-center gap-1">
          ${needsBroker ? `<select id="screen-pop-broker" class="tactical-select text-[10px] py-1">${brokerOptions}</select>` : ''}
          <button class="tactical-select text-[10px] py-1 border-[var(--green)] text-[var(--green)]" onclick="brainboardDisposition('${attempt.id}','advance',${needsBroker})">Advance</button>
          <button class="tactical-select text-[10px] py-1 border-[var(--crimson)] text-[var(--crimson)]" onclick="brainboardDisposition('${attempt.id}','purge',${needsBroker})">Purge</button>
        </div>`;
      panel.classList.remove("hidden");
    }

    window.brainboardDisposition = async function(attemptId, disposition, needsBroker) {
      const payload = { disposition };
      if (needsBroker) {
        const select = document.getElementById("screen-pop-broker");
        payload.co_broker = select ? select.value : null;
      }
      try {
        await fetchJSON(`/api/dialer/attempts/${attemptId}/disposition`, {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
        });
        document.getElementById("screen-pop-panel").classList.add("hidden");
      } catch (err) {
        alert("Disposition failed: " + err.message);
      }
    };

    async function pollActiveAttempts() {
      try {
        const attempts = await fetchJSON("/api/dialer/attempts/active");
        for (const a of attempts) {
          if (a.status !== "in-progress" || poppedAttempts.has(a.id)) continue;
          poppedAttempts.add(a.id);
          const entityUid = a.lead_uid || a.silo_candidate_uid;
          if (!entityUid) continue;
          const data = await fetchJSON(`/api/dialer/screen-pop/${entityUid}`);
          renderScreenPop(a, data);
        }
      } catch (err) {
        // Polling widget stays silent on failure -- dialer may not be configured yet.
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      initActiveLineSelect();
      setInterval(pollActiveAttempts, 3000);
    });
  })();
  </script>
</body>
</html>
