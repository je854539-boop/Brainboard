{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-between mb-4">
  <h1 class="stencil-header text-lg text-[var(--amber)]">Globe // Maritime &amp; Geospatial Surveillance</h1>
  <button id="globe-refresh-btn" class="tactical-select hover:border-[var(--amber)] hover:text-[var(--amber)]">Refresh Signals</button>
</div>

<div class="grid grid-cols-1 lg:grid-cols-4 gap-4 mb-4">
  <div class="tactical-panel p-3 lg:col-span-1">
    <div class="stencil-header text-[10px] text-[var(--text-dim)] mb-2">Sources</div>
    <div id="source-status" class="flex flex-col gap-1.5 text-[10px]"></div>
  </div>
  <div class="tactical-panel p-3 lg:col-span-3 flex items-center gap-6">
    <div><div class="text-[10px] text-[var(--text-dim)] uppercase">Signals Tracked</div><div id="signal-count" class="hud-value text-lg">0</div></div>
    <div class="flex items-center gap-2 text-[10px]"><span class="inline-block w-3 h-3" style="background:var(--amber)"></span> GFW 4Wings (marine traffic)</div>
    <div class="flex items-center gap-2 text-[10px]"><span class="inline-block w-3 h-3" style="background:var(--crimson)"></span> GDELT (conflict zones, last 24h)</div>
  </div>
</div>

<div id="globe-status" class="text-[10px] text-[var(--text-dim)] mb-2"></div>
<div class="tactical-panel" style="height:600px; position:relative;">
  <div id="globe-container" style="width:100%; height:100%;"></div>
</div>

<script type="module">
import * as THREE from '/static/vendor/three/three.module.min.js';

const AMBER = 0xffb000, CRIMSON = 0xff3333, PANEL_BORDER = 0x2d333b, BG = 0x121417;

async function fetchJSON(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error(`${url} -> ${res.status}`);
  return res.json();
}

function latLonToVec3(lat, lon, r) {
  const phi = (90 - lat) * (Math.PI / 180);
  const theta = (lon + 180) * (Math.PI / 180);
  return new THREE.Vector3(
    -r * Math.sin(phi) * Math.cos(theta),
    r * Math.cos(phi),
    r * Math.sin(phi) * Math.sin(theta)
  );
}

const container = document.getElementById('globe-container');
const scene = new THREE.Scene();
scene.background = new THREE.Color(BG);

const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
camera.position.set(0, 0, 6.5);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(container.clientWidth, container.clientHeight);
container.appendChild(renderer.domElement);

const globeGroup = new THREE.Group();
scene.add(globeGroup);

// Dark solid core sphere (the "body" of the globe)
const core = new THREE.Mesh(
  new THREE.SphereGeometry(1.98, 48, 48),
  new THREE.MeshBasicMaterial({ color: 0x0a0c0e })
);
globeGroup.add(core);

// Wireframe lat/lon grid overlay -- kept subtle now that real country
// borders (below) are the crisp readable layer.
const wireframe = new THREE.Mesh(
  new THREE.SphereGeometry(2, 32, 24),
  new THREE.MeshBasicMaterial({ color: PANEL_BORDER, wireframe: true, transparent: true, opacity: 0.25 })
);
globeGroup.add(wireframe);

// Real country borders (Natural Earth 110m via world-atlas, pre-flattened
// at build time by scripts/build-country-borders.js -- see that file to
// regenerate at a finer resolution).
async function renderCountryBorders() {
  const rings = await fetchJSON('/static/data/country-borders.json');
  const r = 2.001;
  const positions = [];
  for (const ring of rings) {
    for (let i = 0; i < ring.length - 1; i++) {
      const [lon1, lat1] = ring[i];
      const [lon2, lat2] = ring[i + 1];
      const p1 = latLonToVec3(lat1, lon1, r);
      const p2 = latLonToVec3(lat2, lon2, r);
      positions.push(p1.x, p1.y, p1.z, p2.x, p2.y, p2.z);
    }
  }
  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  const material = new THREE.LineBasicMaterial({ color: AMBER, transparent: true, opacity: 0.45 });
  globeGroup.add(new THREE.LineSegments(geometry, material));
}

const signalMeshes = new THREE.Group();
globeGroup.add(signalMeshes);

async function renderSignals() {
  const signals = await fetchJSON('/api/globe/signals');
  document.getElementById('signal-count').textContent = signals.length;

  while (signalMeshes.children.length) signalMeshes.remove(signalMeshes.children[0]);

  const dotGeometry = new THREE.SphereGeometry(0.02, 6, 6);
  for (const s of signals) {
    const color = s.source === 'gdelt' ? CRIMSON : AMBER;
    const dot = new THREE.Mesh(dotGeometry, new THREE.MeshBasicMaterial({ color }));
    dot.position.copy(latLonToVec3(s.latitude, s.longitude, 2.02));
    signalMeshes.add(dot);
  }
}

async function renderSourceStatus() {
  const sources = await fetchJSON('/api/globe/sources');
  document.getElementById('source-status').innerHTML = sources.map(s => `
    <div class="flex items-center justify-between">
      <span class="uppercase tracking-wide">${s.source}</span>
      <span class="status-badge ${s.enabled ? 'status-badge--funded' : 'status-badge--attrition'}">${s.enabled ? 'LIVE' : 'OFF'}</span>
    </div>
  `).join('');
}

document.getElementById('globe-refresh-btn').addEventListener('click', async (e) => {
  e.target.disabled = true;
  e.target.textContent = 'Sweeping...';
  const statusDiv = document.getElementById('globe-status');
  try {
    const data = await fetchJSON('/api/globe/refresh', { method: 'POST' });
    statusDiv.textContent = 'Ingested: ' + Object.entries(data.ingested).map(([s, r]) => r.error ? `${s}:ERROR(${r.error})` : `${s}:${r.count}`).join(', ');
    await renderSignals();
  } catch (err) {
    statusDiv.textContent = 'Refresh failed: ' + err.message;
  } finally {
    e.target.disabled = false;
    e.target.textContent = 'Refresh Signals';
  }
});

// Slow continuous spin, per spec -- plus basic click-drag to look around.
let dragging = false, lastX = 0, lastY = 0, rotY = 0, rotX = 0;
renderer.domElement.addEventListener('pointerdown', (e) => { dragging = true; lastX = e.clientX; lastY = e.clientY; });
window.addEventListener('pointerup', () => dragging = false);
window.addEventListener('pointermove', (e) => {
  if (!dragging) return;
  rotY += (e.clientX - lastX) * 0.005;
  rotX += (e.clientY - lastY) * 0.005;
  rotX = Math.max(-1, Math.min(1, rotX));
  lastX = e.clientX; lastY = e.clientY;
});

function animate() {
  requestAnimationFrame(animate);
  if (!dragging) rotY += 0.0015;
  globeGroup.rotation.y = rotY;
  globeGroup.rotation.x = rotX;
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = container.clientWidth / container.clientHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(container.clientWidth, container.clientHeight);
});

renderCountryBorders();
renderSourceStatus();
renderSignals();
animate();
</script>
{% endblock %}
