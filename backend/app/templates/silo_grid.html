{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-between mb-4">
  <h1 class="stencil-header text-lg text-[var(--amber)]">Silo Intelligence Grid</h1>
  <button id="leadgen-btn" class="tactical-select hover:border-[var(--amber)] hover:text-[var(--amber)]">Run Lead-Gen Sweep</button>
</div>
<div id="leadgen-result" class="text-[10px] text-[var(--text-dim)] mb-3"></div>

<form
  id="silo-filters"
  class="tactical-panel p-3 mb-4 flex flex-wrap gap-3 items-center"
  hx-get="/partials/silo-rows"
  hx-target="#silo-rows-body"
  hx-trigger="change"
>
  <div>
    <label class="block text-[10px] uppercase tracking-widest text-[var(--text-dim)] mb-1">Silo</label>
    <select name="silo" class="tactical-select min-w-[280px]">
      <option value="">All 9 Silos</option>
      {% for s in silos %}
      <option value="{{ s.value }}">{{ s.value }}</option>
      {% endfor %}
    </select>
  </div>
  <div>
    <label class="block text-[10px] uppercase tracking-widest text-[var(--text-dim)] mb-1">Status</label>
    <select name="status" class="tactical-select">
      <option value="">All</option>
      <option value="pending">Pending</option>
      <option value="converted">Converted</option>
      <option value="dismissed">Dismissed</option>
    </select>
  </div>
  <div class="ml-auto text-[10px] uppercase tracking-widest text-[var(--text-dim)]">
    <span class="htmx-indicator" id="silo-loading">Syncing...</span>
  </div>
</form>

<div class="tactical-panel scroll-panel">
  <table class="tactical-table">
    <thead>
      <tr>
        <th>Candidate UID</th>
        <th>Silo</th>
        <th>Company (A)</th>
        <th>Phone (C)</th>
        <th>Source Ref (D)</th>
        <th>Dossier (F)</th>
        <th>Score (G)</th>
        <th>Status (H)</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="silo-rows-body" hx-get="/partials/silo-rows" hx-trigger="load" hx-indicator="#silo-loading">
      <tr><td colspan="9" class="text-center text-[var(--text-dim)] py-6">Loading silo candidates...</td></tr>
    </tbody>
  </table>
</div>

<script>
document.getElementById("leadgen-btn").addEventListener("click", async (e) => {
  e.target.disabled = true;
  e.target.textContent = "Sweeping...";
  const resultDiv = document.getElementById("leadgen-result");
  try {
    const res = await fetch("/api/silo/leadgen/run", { method: "POST" });
    const data = await res.json();
    const ingested = Object.entries(data.telemetry_ingested).map(([s, r]) => r.error ? `${s}:ERROR(${r.error})` : `${s}:${r.count}`).join(", ");
    const created = Object.entries(data.candidates_created).filter(([, n]) => n > 0).map(([s, n]) => `${s}:+${n}`).join(", ");
    resultDiv.textContent = `Telemetry ingested -- ${ingested}. Candidates created -- ${created || "(none -- no sources configured or nothing new)"}`;
    htmx.trigger("#silo-filters", "change");
  } catch (err) {
    resultDiv.textContent = "Sweep failed: " + err.message;
  } finally {
    e.target.disabled = false;
    e.target.textContent = "Run Lead-Gen Sweep";
  }
});
</script>
{% endblock %}
