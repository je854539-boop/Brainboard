services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: brainboard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brainboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brainboard}
      POSTGRES_DB: ${POSTGRES_DB:-brainboard}
    ports:
      - "5432:5432"
    volumes:
      - brainboard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brainboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: brainboard_api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    # No published port here on purpose -- caddy is the only thing that
    # should be reachable from outside the box, terminating TLS and
    # proxying in over the docker network (api:8000). For local dev
    # without Caddy, temporarily add `ports: ["8000:8000"]` back.

  caddy:
    image: caddy:2-alpine
    container_name: brainboard_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  brainboard_pgdata:
  caddy_data:
  caddy_config:
