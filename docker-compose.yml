services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: brainboard_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-brainboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-brainboard}
      POSTGRES_DB: ${POSTGRES_DB:-brainboard}
    ports:
      - "5432:5432"
    volumes:
      - brainboard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-brainboard}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: brainboard_api
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app

volumes:
  brainboard_pgdata:
